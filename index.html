<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title></title>
    <!-- Mocks webxdc if running outside of WebXDC -->
    <script src="webxdc.js"></script>
    <link href="style.css" rel="stylesheet">
  </head>
  <body class="app-body">
    <div id="app" class="app-container">
      <!-- Header -->
      <header id="app-header" class="app-header relative">
        <div class="content-limiter flex-row justify-center items-center relative py-1">
          <h1 id="header-title" class="header-title text-center" data-i18n="title">title</h1>
          
          <!-- Header Controls (Theme and Language) -->
          <div class="header-controls absolute-side flex-row items-center gap-2">
            <!-- Theme Toggle -->
            <button id="btn-toggle-theme" class="btn-theme-toggle" data-i18n-title="theme_toggle">
              <span id="theme-icon">🌙</span>
            </button>
            <!-- Language Selector (options are generated from i18n.js) -->
            <select id="select-lang" class="select-lang" data-i18n-title="language"></select>
          </div>
        </div>
      </header>

      <!-- Main Content Area -->
      <main id="main-content" class="main-content">
        
        <!-- Login Screen -->
        <div id="screen-login" class="screen flex-center p-6">
          <div class="content-limiter flex-col brutalist-card">
            <h2 id="login-title" class="title text-primary mb-6 text-center" data-i18n="login_title">login_title</h2>
            <input type="text" id="nickname-input" data-i18n-placeholder="nickname_placeholder" class="input-text mb-4" maxlength="15">
            <button id="btn-join" class="btn btn-primary w-full" data-i18n="join_btn">join_btn</button>
            <button id="btn-reset-mock" class="btn btn-light w-full mt-2 text-sm text-secondary hidden" data-i18n="reset_mock">reset_mock</button>
          </div>
        </div>

        <!-- Lobby Screen -->
        <div id="screen-lobby" class="screen hidden flex-col p-4">
          <div class="content-limiter flex-col h-full justify-between">
            <div class="player-list-container brutalist-card mb-4">
              <h3 id="lobby-players-title" class="subtitle mb-2" data-i18n="players">players (<span id="player-count">0</span>)</h3>
              <ul id="player-list" class="player-list">
                <!-- Player items go here -->
              </ul>
            </div>
            
            <div id="host-controls" class="hidden host-controls brutalist-card mb-4">
              <h3 id="host-settings-title" class="subtitle text-primary-dark mb-2" data-i18n="host_settings">host_settings</h3>
              <div class="settings-group">
                <div class="setting-item">
                  <label id="label-mode" data-i18n="mode_label">mode_label</label>
                  <select id="setting-mode" class="input-select">
                    <option value="write_draw" selected data-i18n="mode_write_draw">mode_write_draw</option>
                    <option value="draw_write" data-i18n="mode_draw_write">mode_draw_write</option>
                    <option value="only_draw" data-i18n="mode_only_draw">mode_only_draw</option>
                    <option value="only_write" data-i18n="mode_only_write">mode_only_write</option>
                    <option value="write_start_end" data-i18n="mode_write_start_end">mode_write_start_end</option>
                    <option value="write_start" data-i18n="mode_write_start">mode_write_start</option>
                    <option value="write_end" data-i18n="mode_write_end">mode_write_end</option>
                  </select>
                </div>
                <div class="setting-item">
                  <label id="label-rounds" data-i18n="rounds_label">rounds_label</label>
                  <div class="flex-row items-center gap-2">
                    <span class="hint-text" id="rounds-hint" data-i18n="rounds_hint">rounds_hint</span>
                    <input type="text" id="setting-rounds" class="input-number text-center" value="0" min="0" max="20" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                  </div>
                </div>
                <div class="setting-item">
                  <label id="label-time" data-i18n="time_label">time_label</label>
                  <input type="text" id="setting-time" class="input-number text-center" value="60" min="5" max="600" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                </div>
                <div class="setting-item">
                  <label id="label-subject-time" data-i18n="subject_time_label">subject_time_label</label>
                  <input type="text" id="setting-subject-time" class="input-number text-center" value="20" min="5" max="600" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                </div>
              </div>
              <button id="btn-start-game" class="btn btn-success w-full mt-4" data-i18n="start_game">start_game</button>
            </div>

            <div id="player-controls" class="flex-row gap-2 hidden mt-auto">
              <button id="btn-ready" class="btn btn-blue flex-1" data-i18n="ready_btn">ready_btn</button>
              <button id="btn-leave" class="btn btn-danger flex-1" data-i18n="leave_btn">leave_btn</button>
            </div>
          </div>
        </div>

        <!-- Game Screen -->
        <div id="screen-game" class="screen hidden flex-col bg-transparent">
          <div class="game-header">
            <div class="content-limiter flex-row justify-between items-center p-2 relative">
              <span id="game-round-info" class="round-info" data-i18n="round_info">round_info</span>
              
              <span id="game-timer" class="timer text-danger timer-pulse">60</span>
              
              <!-- Hourglass Status Button Container -->
              <div id="hourglass-container" class="relative">
                <button id="btn-status-hourglass" class="btn-status-hourglass">
                  <span class="hourglass-icon">⏳</span>
                  <span id="status-completed-count" class="completed-count">0/0</span>
                </button>
                <!-- Player Status Modal Overlay -->
                <div id="status-dropdown" class="status-dropdown hidden">
                  <div class="status-modal-card">
                    <div class="flex justify-between items-center mb-3 border-b-2 border-black pb-2">
                      <h4 id="status-modal-title" class="font-bold text-base text-primary m-0" data-i18n="players_status">players_status</h4>
                      <button id="btn-close-status-modal-x" class="text-lg font-bold text-secondary hover:text-black leading-none px-1 py-0 cursor-pointer">✕</button>
                    </div>
                    <ul id="status-player-list" class="status-player-list my-2 max-h-60 overflow-y-auto">
                      <!-- list items injected here -->
                    </ul>
                    <button id="btn-close-status-modal" class="btn btn-secondary w-full mt-3 text-sm py-2" data-i18n="close">close</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Prompt Phase -->
          <div id="phase-prompt" class="hidden flex-center p-4">
            <div class="content-limiter flex-col brutalist-card">
              <div id="prompt-context" class="prompt-context hidden">
                <p id="prompt-context-text" class="text-secondary mb-2 text-center" data-i18n="prompt_context">prompt_context</p>
                <div id="prompt-prev-drawing" class="prev-drawing-container">
                  <!-- SVG injected here -->
                </div>
              </div>
              <h3 id="prompt-title" class="title text-primary mb-4 text-center" data-i18n="prompt_title">prompt_title</h3>
              <input type="text" id="prompt-input" class="input-text text-xl mb-4" data-i18n-placeholder="prompt_placeholder" maxlength="50">
              <textarea id="prompt-textarea" class="input-text text-lg mb-4 hidden" data-i18n-placeholder="prompt_textarea_placeholder" rows="5" style="resize: vertical; height: auto; min-height: 120px;"></textarea>
              <button id="btn-submit-prompt" class="btn btn-primary w-full" data-i18n="submit_prompt">submit_prompt</button>
            </div>
          </div>

          <!-- Draw Phase -->
          <div id="phase-draw" class="hidden flex-col w-full h-full">
            <div class="draw-instruction-container">
              <div class="content-limiter text-center">
                <p id="draw-instruction" class="text-secondary text-sm mb-1" data-i18n="draw_instruction">draw_instruction</p>
                <h3 id="draw-subject" class="title text-primary-dark text-lg"></h3>
              </div>
            </div>
            <div class="canvas-wrapper">
              <!-- Square Canvas Container -->
              <div class="canvas-container" id="canvas-container">
                 <!-- The previous drawing if mode=animation -->
                 <div id="draw-prev-canvas" class="canvas-layer prev-layer hidden"></div>
                 <svg id="drawing-svg" class="canvas-layer drawing-layer" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet"></svg>
                 <!-- Canvas lock overlay -->
                 <div id="canvas-lock-overlay" class="canvas-lock-overlay hidden"></div>
              </div>
            </div>
            <!-- Toolbar -->
            <div class="toolbar">
              <div class="content-limiter">
                <div id="paint-controls-container">
                  <div class="toolbar-row mb-3">
                    <div class="color-palette-container" id="color-palette-container" style="display: flex; flex-direction: column; gap: 0.25rem;">
                      <div class="color-row" style="display: flex; gap: 0.25rem; flex-direction: row-reverse;">
                        <div class="color-btn" style="background-color: #000000; width: 1.5rem; height: 1.5rem;" data-color="#000000"></div>
                        <div class="color-btn" style="background-color: #4b5563; width: 1.5rem; height: 1.5rem;" data-color="#4b5563"></div>
                        <div class="color-btn" style="background-color: #ef4444; width: 1.5rem; height: 1.5rem;" data-color="#ef4444"></div>
                        <div class="color-btn" style="background-color: #f97316; width: 1.5rem; height: 1.5rem;" data-color="#f97316"></div>
                        <div class="color-btn" style="background-color: #eab308; width: 1.5rem; height: 1.5rem;" data-color="#eab308"></div>
                        <div class="color-btn" style="background-color: #22c55e; width: 1.5rem; height: 1.5rem;" data-color="#22c55e"></div>
                        <div class="color-btn" style="background-color: #06b6d4; width: 1.5rem; height: 1.5rem;" data-color="#06b6d4"></div>
                        <div class="color-btn" style="background-color: #3b82f6; width: 1.5rem; height: 1.5rem;" data-color="#3b82f6"></div>
                      </div>
                      <div class="color-row" style="display: flex; gap: 0.25rem; flex-direction: row-reverse; margin-top: 0.25rem;">
                        <div class="color-btn" style="background-color: #6366f1; width: 1.5rem; height: 1.5rem;" data-color="#6366f1"></div>
                        <div class="color-btn" style="background-color: #a855f7; width: 1.5rem; height: 1.5rem;" data-color="#a855f7"></div>
                        <div class="color-btn" style="background-color: #ec4899; width: 1.5rem; height: 1.5rem;" data-color="#ec4899"></div>
                        <div class="color-btn" style="background-color: #fca5a5; width: 1.5rem; height: 1.5rem;" data-color="#fca5a5"></div>
                        <div class="color-btn" style="background-color: #fef08a; width: 1.5rem; height: 1.5rem;" data-color="#fef08a"></div>
                        <div class="color-btn" style="background-color: #bbf7d0; width: 1.5rem; height: 1.5rem;" data-color="#bbf7d0"></div>
                        <div class="color-btn" style="background-color: #ffffff; width: 1.5rem; height: 1.5rem;" data-color="#ffffff"></div>
                        <!-- Custom color picker button with Conic Gradient -->
                        <div class="color-btn" id="btn-custom-color" style="background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); width: 1.5rem; height: 1.5rem; position: relative;" data-color="#a855f7" data-i18n-title="custom_color">
                          <input type="color" id="input-custom-color" style="opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; padding: 0; border: none;">
                        </div>
                      </div>
                    </div>
                    <div class="tools flex-row gap-2">
                      <button id="btn-undo" class="tool-btn btn-light" data-i18n-title="undo">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3l-3 2.7"/></svg>
                      </button>
                      <button id="btn-tool-background" class="tool-btn btn-light" data-i18n-title="background">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>
                      </button>
                    </div>
                  </div>
                  <div class="toolbar-row mb-3 justify-start gap-2">
                    <span class="text-xs font-bold text-secondary" data-i18n="brush">brush</span>
                    <input type="range" id="tool-size" min="2" max="30" value="5" class="range-slider flex-grow">
                  </div>
                </div>
                <button id="btn-submit-draw" class="btn btn-success w-full" data-i18n="submit_draw">submit_draw</button>
              </div>
            </div>
          </div>

          <!-- Waiting Phase -->
          <div id="phase-wait" class="hidden flex-center p-6 text-center">
            <div class="content-limiter flex-col items-center brutalist-card">
              <svg class="spinner mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <h3 id="wait-title" class="title text-center" data-i18n="waiting_others">waiting_others</h3>
              <p id="wait-round-end" class="text-secondary mt-2 text-center" data-i18n="wait_round_end">wait_round_end</p>
              <div class="wait-status mt-6 w-full text-right">
                <p class="text-sm font-bold text-secondary mb-2" data-i18n="waiting_list_title">waiting_list_title</p>
                <ul id="wait-player-status" class="wait-list"></ul>
              </div>
            </div>
          </div>
        </div>

        <!-- Results Screen -->
        <div id="screen-results" class="screen hidden flex-col">
          <div class="results-header">
            <div class="content-limiter flex-col text-center">
              <h2 id="results-title" class="title text-yellow" data-i18n="results_title">results_title</h2>
              <p id="result-album-title" class="subtitle text-light mt-1"></p>
            </div>
          </div>
          
          <!-- Tabs for finished game timelines -->
          <div id="results-tabs-wrapper" class="hidden flex-shrink-0">
            <div id="results-tabs-container" class="flex flex-row overflow-x-auto whitespace-nowrap scrollbar-none pb-1" style="overflow-x: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: row; width: 100%;">
              <!-- Tabs dynamically injected here -->
            </div>
          </div>
          
          <div id="results-scroll-area" class="results-scroll-area pb-24">
             <!-- Result items injected here one by one -->
          </div>

          <div class="results-footer">
            <div class="content-limiter flex-row justify-between gap-2 p-4 w-full">
              <button id="btn-download-results" class="btn btn-yellow flex-1 hidden" data-i18n="download_results_btn">download_results_btn</button>
              <button id="btn-copy-results" class="btn btn-primary flex-1 hidden" data-i18n="copy_results_btn">copy_results_btn</button>
              <button id="btn-next-result" class="btn btn-blue flex-1" data-i18n="next_btn">next_btn</button>
              <button id="btn-back-lobby" class="btn btn-secondary flex-1 hidden" data-i18n="back_lobby_btn">back_lobby_btn</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
